<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".45" stop-color="#F2C230"/><stop offset="1" stop-color="#9A6A00"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#5AB8FF"/><stop offset=".6" stop-color="#1F6FD1"/><stop offset="1" stop-color="#0B2F6B"/></radialGradient>
    <radialGradient id="skin" cx=".42" cy=".34" r=".7"><stop offset="0" stop-color="#FFE6CC"/><stop offset="1" stop-color="#EFAB78"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#CFEAFF" stop-opacity=".5"/><stop offset="1" stop-color="#CFEAFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E4326"/><stop offset="1" stop-color="#3E2312"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#5BB4F5"/></linearGradient>
    <clipPath id="inner"><circle cx="60" cy="60" r="43"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#rim)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#6B4300" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFF8D6" stroke-opacity=".8" stroke-width="1.2" stroke-dasharray="1.6 3.2"/>
  <circle cx="60" cy="60" r="44" fill="url(#face)" stroke="#6B4300" stroke-width="2"/>
  <g clip-path="url(#inner)">
    <circle cx="58" cy="60" r="32" fill="url(#glow)"/>
    <!-- shoulders: dark shirt -->
    <path d="M26 108c2-16 15-24 32-24s30 8 32 24z" fill="#1B2433" stroke="#0A0F18" stroke-width="1.6"/>
    <!-- ears -->
    <ellipse cx="41.5" cy="57" rx="3.6" ry="5" fill="#EFAB78" stroke="#8A4B1E" stroke-width="1.4"/>
    <ellipse cx="74.5" cy="57" rx="3.6" ry="5" fill="#EFAB78" stroke="#8A4B1E" stroke-width="1.4"/>
    <!-- bald head -->
    <path d="M42 58c0-14 7-23 16-23s16 9 16 23c0 6-2 11-4 14H46c-2-3-4-8-4-14z" fill="url(#skin)" stroke="#8A4B1E" stroke-width="1.6"/>
    <!-- shine on the bald head -->
    <path d="M49 42c3-3 7-4 10-3.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="64.5" cy="40.5" r="1.4" fill="#fff" fill-opacity=".85"/>
    <!-- big beard -->
    <path d="M42.5 58c1 4 3 7 6 8 3-2 6-2.6 9.5-2.6S64.5 64 67.5 66c3-1 5-4 6-8 2 9 1 19-4 25-3 4-7 6-11.5 6s-8.5-2-11.5-6c-5-6-6-16-4-25z" fill="url(#beard)" stroke="#2A160A" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M50 74c2 4 4 7 8 9M66 74c-2 4-4 7-8 9M58 70v12" fill="none" stroke="#2A160A" stroke-opacity=".45" stroke-width="1.1" stroke-linecap="round"/>
    <!-- moustache -->
    <path d="M58 64.5c-3-1.6-7-1.4-10 1 3 .4 5 1.6 6.4 2.8 1.4-.6 2.6-1.2 3.6-2.6 1 1.4 2.2 2 3.6 2.6 1.4-1.2 3.4-2.4 6.4-2.8-3-2.4-7-2.6-10-1z" fill="#4A2A15" stroke="#2A160A" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- tight, unconvinced mouth -->
    <path d="M55 69.6h6" stroke="#2A160A" stroke-width="1.6" stroke-linecap="round"/>
    <!-- stern brows -->
    <path d="M47 49.5l9 2.4M69 49.5l-9 2.4" stroke="#3E2312" stroke-width="3" stroke-linecap="round"/>
    <!-- narrowed eyes: "не верю" -->
    <path d="M48.5 55.5c2-1.4 5-1.4 7 0-2 1.6-5 1.6-7 0z" fill="#fff" stroke="#2A1608" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M60.5 55.5c2-1.4 5-1.4 7 0-2 1.6-5 1.6-7 0z" fill="#fff" stroke="#2A1608" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="53" cy="55.5" r="1.3" fill="#2A1608"/><circle cx="65" cy="55.5" r="1.3" fill="#2A1608"/>
  </g>
  <!-- 0‰ -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#FFE27A" stroke="#6B4300" stroke-width="1" paint-order="stroke">
    <text x="22" y="40" font-size="13" transform="rotate(-14 22 40)">0‰</text>
  </g>
  <!-- glass of water -->
  <g transform="translate(80 62) rotate(10)">
    <path d="M0 0h16l-2 22H2z" fill="#EAF6FF" fill-opacity=".55" stroke="#0B2F6B" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M.9 8h14.2L13.6 21.2H2.4z" fill="url(#water)"/>
    <path d="M3 3l1.4 16" stroke="#fff" stroke-opacity=".9" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="9" cy="14" r="1.1" fill="#fff" fill-opacity=".9"/><circle cx="11" cy="10.5" r=".8" fill="#fff" fill-opacity=".9"/>
  </g>
  <!-- healed himself: medic cross -->
  <g transform="translate(25 80) rotate(-10)">
    <circle r="10" fill="#fff" stroke="#C0392B" stroke-width="1.6"/>
    <path d="M-2.6 -6.4h5.2v3.8h3.8v5.2h-3.8v3.8h-5.2v-3.8h-3.8v-5.2h3.8z" fill="#E3263A"/>
  </g>
  <!-- highlight -->
  <path d="M27 42a36 36 0 0 1 30-23" fill="none" stroke="#FFFBE0" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
</svg>
