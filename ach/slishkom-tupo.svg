<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".45" stop-color="#F2C230"/><stop offset="1" stop-color="#9A6A00"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#3BC77A"/><stop offset=".6" stop-color="#16804A"/><stop offset="1" stop-color="#0A4528"/></radialGradient>
    <radialGradient id="skin" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#FFE2C2"/><stop offset="1" stop-color="#F2B07E"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B8FFD2" stop-opacity=".45"/><stop offset="1" stop-color="#B8FFD2" stop-opacity="0"/></radialGradient>
    <clipPath id="inner"><circle cx="60" cy="60" r="43"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#rim)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#6B4300" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFF8D6" stroke-opacity=".8" stroke-width="1.2" stroke-dasharray="1.6 3.2"/>
  <circle cx="60" cy="60" r="44" fill="url(#face)" stroke="#6B4300" stroke-width="2"/>
  <g clip-path="url(#inner)">
    <circle cx="58" cy="62" r="30" fill="url(#glow)"/>
    <!-- shoulders -->
    <path d="M28 106c2-15 14-23 30-23s28 8 30 23z" fill="#E5262C" stroke="#7A0E12" stroke-width="1.6"/>
    <path d="M52 83l6 7 6-7" fill="none" stroke="#7A0E12" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- neck + head -->
    <rect x="52" y="71" width="12" height="12" rx="4" fill="#F2B07E" stroke="#8A4B1E" stroke-width="1.4"/>
    <ellipse cx="58" cy="61" rx="15" ry="16" fill="url(#skin)" stroke="#8A4B1E" stroke-width="1.6"/>
    <!-- curls -->
    <g fill="#7A4220" stroke="#4A2410" stroke-width="1.3">
      <circle cx="44" cy="51" r="6"/><circle cx="47" cy="43" r="6.5"/><circle cx="55" cy="38.5" r="7"/>
      <circle cx="64" cy="39" r="7"/><circle cx="71" cy="44" r="6.5"/><circle cx="73" cy="52" r="5.5"/>
      <circle cx="51" cy="46" r="5"/><circle cx="60" cy="44" r="5.5"/><circle cx="67" cy="47" r="5"/>
    </g>
    <!-- dizzy eyes -->
    <g fill="#fff" stroke="#2A1608" stroke-width="1.3">
      <circle cx="52" cy="61" r="4.6"/><circle cx="64" cy="61" r="4.6"/>
    </g>
    <g fill="none" stroke="#2A1608" stroke-width="1.3" stroke-linecap="round">
      <path d="M52 61m-2.6 0a2.6 2.6 0 1 1 2.6 2.6a1.5 1.5 0 1 1 1.4-1.6"/>
      <path d="M64 61m-2.6 0a2.6 2.6 0 1 1 2.6 2.6a1.5 1.5 0 1 1 1.4-1.6"/>
    </g>
    <!-- open mouth with tongue -->
    <path d="M52 69c2 5 10 5 12 0z" fill="#7A1A1A" stroke="#4A0E0E" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M56 71.6c1-1.4 3-1.4 4 0 0 2-1 3.2-2 3.2s-2-1.2-2-3.2z" fill="#FF7A8A"/>
  </g>
  <!-- question marks -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#FFE27A" stroke="#6B4300" stroke-width="1" paint-order="stroke">
    <text x="27" y="40" font-size="13" transform="rotate(-14 27 40)">?</text>
    <text x="80" y="35" font-size="16" transform="rotate(12 80 35)">?</text>
  </g>
  <!-- smoking pistol + bang -->
  <g transform="translate(76 70) rotate(-28)">
    <path d="M0 0h18v6H6l-2 9H-3l2-9z" fill="#3A3F4A" stroke="#14171C" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="17" y="1" width="3" height="4" fill="#14171C"/>
  </g>
  <path d="M92 58c3-3 1-6 4-8M95 61c4-2 3-6 6-7" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(26 74) rotate(-12)">
    <path d="M0 -10l3 6 6-4-2 7 7 1-6 4 4 6-7-2-1 7-4-6-4 6-1-7-7 2 4-6-6-4 7-1-2-7 6 4z" fill="#FFE27A" stroke="#C0392B" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="5.6" fill="#C0392B">БАХ</text>
  </g>
  <!-- highlight -->
  <path d="M27 42a36 36 0 0 1 30-23" fill="none" stroke="#FFFBE0" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
</svg>
