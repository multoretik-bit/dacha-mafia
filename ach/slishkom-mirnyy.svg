<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".45" stop-color="#F2C230"/><stop offset="1" stop-color="#9A6A00"/></linearGradient>
    <radialGradient id="face" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#FFC9A3"/><stop offset=".55" stop-color="#F08A7E"/><stop offset="1" stop-color="#7A3E8F"/></radialGradient>
    <radialGradient id="skin" cx=".42" cy=".36" r=".7"><stop offset="0" stop-color="#FFE6CC"/><stop offset="1" stop-color="#EBA676"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".6"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2A22"/><stop offset="1" stop-color="#1C130F"/></linearGradient>
    <clipPath id="inner"><circle cx="60" cy="60" r="43"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#rim)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#6B4300" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFF8D6" stroke-opacity=".8" stroke-width="1.2" stroke-dasharray="1.6 3.2"/>
  <circle cx="60" cy="60" r="44" fill="url(#face)" stroke="#6B4300" stroke-width="2"/>
  <g clip-path="url(#inner)">
    <!-- sunset sea -->
    <path d="M16 84h88v30H16z" fill="#3B5A9E"/>
    <path d="M24 88h14M46 92h20M74 88h16M30 97h12M80 96h10" stroke="#FFD2A8" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="58" cy="58" r="30" fill="url(#glow)"/>
    <!-- halo: a saint of the peaceful city -->
    <ellipse cx="58" cy="31" rx="13" ry="3.6" fill="none" stroke="#FFE27A" stroke-width="2.6"/>
    <ellipse cx="58" cy="31" rx="13" ry="3.6" fill="none" stroke="#FFF8D6" stroke-opacity=".8" stroke-width="1"/>
    <!-- black shirt + chain -->
    <path d="M26 110c2-16 15-24 32-24s30 8 32 24z" fill="#15181F" stroke="#05070B" stroke-width="1.6"/>
    <path d="M51 85l7 9 7-9" fill="#EBA676" stroke="#8A4B1E" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M51.5 86.5c2 6 4.4 8.4 6.5 8.4s4.5-2.4 6.5-8.4" fill="none" stroke="#E8E8EE" stroke-width="1.1" stroke-dasharray="1.2 1"/>
    <!-- neck + head -->
    <rect x="51.5" y="70" width="13" height="16" rx="4" fill="#EBA676" stroke="#8A4B1E" stroke-width="1.4"/>
    <ellipse cx="42.2" cy="58" rx="3.4" ry="4.8" fill="#EBA676" stroke="#8A4B1E" stroke-width="1.4"/>
    <ellipse cx="73.8" cy="58" rx="3.4" ry="4.8" fill="#EBA676" stroke="#8A4B1E" stroke-width="1.4"/>
    <path d="M43 56c0-12 6.6-19 15-19s15 7 15 19c0 11-6.6 18.5-15 18.5S43 67 43 56z" fill="url(#skin)" stroke="#8A4B1E" stroke-width="1.6"/>
    <!-- short dark hair, a bit longer and swept on top -->
    <path d="M42.6 56c-1.4-11 3-19.6 11-21.6 6-1.6 13 .4 16.6 4.6 3 3.4 4.2 9 3.4 16.6-1.2-4.6-3-7.4-5.6-8.8-4.4 1.6-10 1.8-15.4.2-3.6 1.6-6.6 4.6-10 9z" fill="url(#hair)" stroke="#120C09" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M50 40c4-2.4 9-3 13.4-1.4" fill="none" stroke="#6B5246" stroke-width="1.4" stroke-linecap="round"/>
    <!-- calm, blissfully closed eyes -->
    <path d="M48.6 57.4c1.6 1.8 4.6 1.8 6.2 0M61.2 57.4c1.6 1.8 4.6 1.8 6.2 0" fill="none" stroke="#2A1608" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M48.4 52.6l6-.8M67.6 52.6l-6-.8" stroke="#2A1608" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="48" cy="63" r="2.6" fill="#FF8A8A" fill-opacity=".45"/><circle cx="68" cy="63" r="2.6" fill="#FF8A8A" fill-opacity=".45"/>
    <!-- peaceful smile -->
    <path d="M53.6 65.6c2.6 2.6 6.2 2.6 8.8 0" fill="none" stroke="#7A2E1E" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <!-- ×13 -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="#FFE27A" stroke="#6B4300" stroke-width="1.1" paint-order="stroke">
    <text x="18" y="44" font-size="15" transform="rotate(-14 18 44)">×13</text>
  </g>
  <!-- dove of peace with an olive twig -->
  <g transform="translate(86 66) rotate(-8)">
    <path d="M-12 2c4-1 7 0 9 2 1-6 5-11 11-12-2 4-2 7-1 9 4-1 7 1 8 3-3 0-5 1-6 3l-4 6c-4 2-11 1-15-3-1-3-1-6-2-8z" fill="#fff" stroke="#3B4660" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M9 3l5-1.4-4.4 3z" fill="#F2A33A" stroke="#8A5A10" stroke-width=".8" stroke-linejoin="round"/>
    <circle cx="7" cy="2.2" r=".9" fill="#1C2333"/>
    <path d="M-1 -1c2-3 5-5 8-6" fill="none" stroke="#C9D2E3" stroke-width="1" stroke-linecap="round"/>
    <path d="M14 4c2 2 3 4 3 7" fill="none" stroke="#3E7A2E" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="17.6" cy="7" rx="2.2" ry="1" fill="#5DA846" transform="rotate(50 17.6 7)"/>
    <ellipse cx="15" cy="9.6" rx="2.2" ry="1" fill="#5DA846" transform="rotate(-30 15 9.6)"/>
  </g>
  <!-- role card: civilian -->
  <g transform="translate(25 80) rotate(-12)">
    <rect x="-8" y="-11" width="16" height="22" rx="3" fill="#fff" stroke="#3B4660" stroke-width="1.4"/>
    <path d="M-4.6 1.6 0-3l4.6 4.6V6h-9.2z" fill="#4ADE80" stroke="#16803A" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="-1.2" y="2.4" width="2.4" height="3.6" fill="#16803A"/>
  </g>
  <!-- highlight -->
  <path d="M27 42a36 36 0 0 1 30-23" fill="none" stroke="#FFFBE0" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
</svg>
